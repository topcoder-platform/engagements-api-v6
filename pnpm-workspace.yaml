packages:
  - '.'
  - 'packages/engagements-prisma-client'

# The existing bus wrapper intentionally consumes tc-core-library-js from GitHub.
blockExoticSubdeps: false
# Prisma is a build-time peer of @prisma/client; do not auto-install it in the
# production-only dependency stage.
autoInstallPeers: false

overrides:
  '@topcoder-platform/topcoder-bus-api-wrapper>tc-core-library-js': '$tc-core-library-js'
  '@babel/core@<=7.29.0': 7.29.6
  '@hono/node-server@<2.0.11': 2.0.11
  '@prisma/streams-local>ajv': 8.18.0
  'ajv@<6.14.0': 6.15.0
  'ajv@>=7.0.0 <8.18.0': 8.18.0
  axios: 1.18.1
  'body-parser@>=2.0.0 <2.3.0': 2.3.0
  'brace-expansion@>=1.0.0 <1.1.18': 1.1.18
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'deepmerge-ts@<8.0.0': 8.0.0
  defu: 6.1.7
  effect: 3.22.0
  'diff@>=4.0.0 <4.0.4': 4.0.4
  'fast-uri@>=3.0.0 <4.1.2': 4.1.2
  'flatted@<3.4.2': 3.4.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  hono: 4.12.34
  'handlebars@<4.7.9': 4.7.9
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'js-yaml@>=5.0.0 <5.2.2': 5.2.2
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  joi: 18.2.3
  jws: 4.0.1
  lodash: 4.18.1
  'minimatch@<3.1.4': 3.1.4
  multer: 2.2.0
  path-to-regexp: 8.4.2
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.4
  qs: 6.15.3
  'valibot@<=1.4.1': 1.4.2

allowBuilds:
  '@nestjs/core@11.1.28': false
  '@prisma/engines@7.8.0': true
  '@scarf/scarf@1.4.0': false
  'dtrace-provider@0.8.8': false
  'prisma@7.8.0': true
