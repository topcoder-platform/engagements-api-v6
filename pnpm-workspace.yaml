  '@hono/node-server': 2.1.3
  'js-yaml@^3': 3.15.2
  'js-yaml@^4': 4.3.2
  'js-yaml@^5': 5.4.1
  'brace-expansion@^1': 1.1.21
  'brace-expansion@^5': 5.0.12
  'fast-uri': 4.2.3
  'body-parser@^2': 2.4.0
  'glob@>=9': 14.0.2
  'minimatch@<9': file:tools/minimatch-compat
