packages:
  - '.'
  - 'packages/engagements-prisma-client'

# The existing bus wrapper intentionally consumes tc-core-library-js from GitHub.
blockExoticSubdeps: false
# Keep production dependencies explicit, including Prisma for startup migrations.
autoInstallPeers: false

